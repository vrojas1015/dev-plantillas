# =============================================================================
# Plantilla Copier: repo central de documentación (issues, ADRs, runbooks,
# releases) con frontmatter validado, índices generados y sitio MkDocs Material.
# =============================================================================
# Ver README.md (al lado de este archivo) y docs/06-documentacion.md del repo
# dev-plantillas. Todo lo que vive en template/ es el contenido del repo
# generado; lo que está acá afuera no se copia.
# =============================================================================

# 9.3: `{% yield %}` en nombres de archivo (una ficha por repo inicial).
_min_copier_version: "9.3.0"
_subdirectory: template
_answers_file: .copier-answers.yml
_templates_suffix: .jinja

# Los índices de contenido/_generado/ los escribe scripts/generar.py. La
# plantilla trae la primera versión (para que el repo nazca consistente) pero
# un `copier update` nunca los pisa: después del update se corre `make generar`.
_skip_if_exists:
  - contenido/_generado/*.md

_message_after_copy: |
  Repo de documentación generado en {{ _copier_conf.dst_path }}.

  Siguientes pasos:
    1. cd {{ _copier_conf.dst_path }}
    2. git init -b main
    3. make instalar     (crea .venv e instala requirements.txt)
    4. make validar && make construir
    5. make servir       (http://localhost:8000)
    6. git add . && git commit -m "docs: scaffold inicial desde la plantilla docs"
  Sin make: ver "Comandos" en README.md (python scripts/...).

# -----------------------------------------------------------------------------
# Preguntas
# -----------------------------------------------------------------------------

org_name:
  type: str
  help: "Organización/grupo en GitLab o GitHub (ej. mi-org)"
  default: mi-org
  validator: >-
    {% if not (org_name | regex_search('^[a-z0-9][a-z0-9-]*$')) %}
    Solo minúsculas, dígitos y guiones.
    {% endif %}

titulo_sitio:
  type: str
  help: "Título del sitio de documentación"
  default: "Documentación de {{ org_name }}"

repos_iniciales:
  type: yaml
  help: "Repos de la plataforma (lista YAML, nombres exactos); se crea una ficha por cada uno"
  default: "[protos, api-gateway]"
  validator: >-
    {% if repos_iniciales is string or repos_iniciales is not sequence %}
    Tiene que ser una lista YAML, ej. [protos, api-gateway].
    {% elif repos_iniciales | length != repos_iniciales | unique | list | length %}
    Hay repos repetidos.
    {% else %}{% for r in repos_iniciales %}
    {% if not (r | string | regex_search('^[a-z][a-z0-9]*(-[a-z0-9]+)*$')) %}
    "{{ r }}" no es un nombre de repo válido (kebab-case: minúsculas, dígitos y guiones).
    {% endif %}{% endfor %}{% endif %}

obsidian:
  type: bool
  help: "¿Incluir una configuración mínima de Obsidian (contenido/ como vault)?"
  default: true

deploy_target:
  type: str
  help: "¿Dónde se publica el sitio?"
  choices:
    Firebase Hosting (deploy keyless desde CI): firebase-hosting
    Coolify v4 en un VPS propio (imagen Docker + Caddy): coolify
    Ninguno (se lee desde el repo; sólo CI de verificación): ninguno
  default: ninguno

firebase_project:
  type: str
  help: "ID del proyecto Firebase/GCP donde se publica (no el número)"
  default: "{{ org_name }}-docs"
  when: "{{ deploy_target == 'firebase-hosting' }}"
  validator: >-
    {% if not (firebase_project | regex_search('^[a-z][a-z0-9-]{4,28}[a-z0-9]$')) %}
    ID de proyecto GCP inválido (6-30 caracteres, minúsculas, números y guiones).
    {% endif %}

ci_provider:
  type: str
  help: "¿Dónde vive el repo / qué CI se genera?"
  choices:
    GitLab CI: gitlab
    GitHub Actions: github
  default: gitlab

fecha_inicio:
  type: str
  help: "Fecha del ADR 0001 y del issue de ejemplo (AAAA-MM-DD)"
  default: "{{ '%Y-%m-%d' | strftime }}"
  validator: >-
    {% if not (fecha_inicio | regex_search('^[0-9]{4}-[0-9]{2}-[0-9]{2}$')) %}
    Formato AAAA-MM-DD.
    {% endif %}

# -----------------------------------------------------------------------------
# Valores derivados (no se preguntan ni se guardan; se recalculan en cada
# copy/update). Flags cortos para nombres de archivo condicionales: Windows
# corta las rutas en 260 caracteres.
# -----------------------------------------------------------------------------

deploy_fb:
  type: bool
  default: "{{ deploy_target == 'firebase-hosting' }}"
  when: false

deploy_cy:
  type: bool
  default: "{{ deploy_target == 'coolify' }}"
  when: false

ci_gl:
  type: bool
  default: "{{ ci_provider == 'gitlab' }}"
  when: false

ci_gh:
  type: bool
  default: "{{ ci_provider == 'github' }}"
  when: false

# https://gitlab.com/<org> o https://github.com/<org>: base de url_repo de las fichas.
url_org:
  type: str
  default: "https://{% if ci_provider == 'github' %}github.com{% else %}gitlab.com{% endif %}/{{ org_name }}"
  when: false

# Tipo de ficha de cada repo inicial, deducido del nombre (se corrige en la
# ficha). Lo usan las fichas y el mapa de servicios inicial de _generado/.
tipos_repo:
  type: yaml
  when: false
  default: >-
    {
    {%- for r in repos_iniciales -%}
    "{{ r }}": "{% if r == 'protos' or r.endswith('-protos') %}protos{% elif 'gateway' in r %}gateway{% elif r.endswith('-service') %}servicio-go{% elif r.endswith('-web') or r.endswith('-app') %}front{% else %}otro{% endif %}"{{ ", " if not loop.last }}
    {%- endfor -%}
    }
