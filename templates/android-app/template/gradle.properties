# Memoria del daemon y de Kotlin (Robolectric + R8 la necesitan).
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
kotlin.daemon.jvmargs=-Xmx2g
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
# R clases por módulo (más chicas y builds más rápidos).
android.nonTransitiveRClass=true

# Versión de la app: la pone el CI desde el tag (VERSION_NAME / VERSION_CODE);
# esto es solo el valor local. Nunca se sube a mano para publicar.
versionName=0.1.0
