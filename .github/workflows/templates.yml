# Genera cada plantilla con varias combinaciones de respuestas y verifica que el
# proyecto resultante compile y pase sus tests. Una plantilla rota no se mergea.
name: templates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go-grpc-service:
    name: go-grpc-service (${{ matrix.ci }}, ${{ matrix.deploy }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { ci: gitlab, deploy: cloud-run }
          - { ci: github, deploy: cloud-run }
          - { ci: gitlab, deploy: coolify }
          - { ci: github, deploy: ninguno }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install copier
      - name: Generar
        run: |
          copier copy --defaults --trust \
            -d service_name=demo -d ci_provider=${{ matrix.ci }} \
            -d deploy_target=${{ matrix.deploy }} \
            templates/go-grpc-service "$RUNNER_TEMP/demo-service"
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ runner.temp }}/demo-service/go.mod
      - name: Build, vet y tests
        working-directory: ${{ runner.temp }}/demo-service
        run: |
          go mod tidy
          go build ./...
          go vet ./...
          go test -count=1 ./...
          test -z "$(gofmt -l .)"
      - name: verify.sh del plugin sobre el proyecto generado
        run: bash plugins/dev-agentes/skills/verificar/scripts/verify.sh "$RUNNER_TEMP/demo-service"

  api-gateway:
    name: api-gateway (${{ matrix.auth }}, ${{ matrix.ci }}, ${{ matrix.deploy }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { auth: firebase, ci: gitlab, deploy: cloud-run }
          - { auth: oidc,     ci: github, deploy: coolify }
          - { auth: api-key,  ci: gitlab, deploy: ninguno }
          - { auth: ninguno,  ci: github, deploy: cloud-run }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install copier
      - name: Generar
        run: |
          copier copy --defaults --trust             -d auth=${{ matrix.auth }} -d ci_provider=${{ matrix.ci }}             -d deploy_target=${{ matrix.deploy }}             templates/api-gateway "$RUNNER_TEMP/gw"
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ runner.temp }}/gw/go.mod
      - name: Build, vet, tests (incluye autorización por ruta) y govulncheck
        working-directory: ${{ runner.temp }}/gw
        run: |
          go mod tidy -diff
          go build ./...
          go vet ./...
          go test -count=1 ./...
          test -z "$(gofmt -l .)"
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  angular-app:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { auth: true,  i18n: true,  ci: gitlab, deploy: firebase-hosting }
          - { auth: false, i18n: false, ci: github, deploy: ninguno }
          - { auth: true,  i18n: false, ci: github, deploy: coolify }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install copier
      - name: Generar
        run: |
          copier copy --defaults --trust \
            -d app_name=demo-web -d use_firebase_auth=${{ matrix.auth }} \
            -d i18n=${{ matrix.i18n }} -d ci_provider=${{ matrix.ci }} \
            -d deploy_target=${{ matrix.deploy }} \
            templates/angular-app "$RUNNER_TEMP/demo-web"
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - name: Install, lint, tests y build
        working-directory: ${{ runner.temp }}/demo-web
        run: |
          npm install --no-audit --no-fund
          npm run lint
          npm run test:unit
          npm run build
      - name: Imagen Docker (coolify)
        if: matrix.deploy == 'coolify'
        working-directory: ${{ runner.temp }}/demo-web
        run: |
          docker build --build-arg APP_ENV=prod -t demo-web:ci .
          docker run -d --name web -p 8080:80 demo-web:ci
          for i in $(seq 1 20); do curl -fsS -o /dev/null http://localhost:8080/ && break; sleep 1; done
          curl -fsS http://localhost:8080/ | grep -q '<app-root'
          curl -fsS http://localhost:8080/items/123 | grep -q '<app-root'   # fallback SPA
          curl -fsSI http://localhost:8080/ | grep -qi 'cache-control: no-cache'

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - run: npm install -g @anthropic-ai/claude-code
      - name: Validar marketplace y plugin
        run: |
          claude plugin validate --strict .
          claude plugin validate --strict plugins/dev-agentes
      - name: Sintaxis de scripts
        run: find plugins scripts -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - name: Tests de hooks
        run: bash plugins/dev-agentes/tests/hooks.test.sh

  # Proyecto en coolify que migra a cloud-run con copier update: sin conflictos
  # y sigue compilando. Copier necesita la plantilla en un repo git con tags.
  go-migracion-coolify-a-cloud-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install copier
      - name: Plantilla como repo con tag
        run: |
          cp -r templates/go-grpc-service "$RUNNER_TEMP/tpl"
          cd "$RUNNER_TEMP/tpl"
          git init -q && git add -A
          git -c user.name=ci -c user.email=ci@example.com commit -qm tpl
          git tag v0.0.1   # tag PEP 440 válido: Copier ignora tags como v0.0.0-ci
      - name: Generar en coolify y migrar
        run: |
          copier copy --defaults --trust -d service_name=demo -d deploy_target=coolify "$RUNNER_TEMP/tpl" "$RUNNER_TEMP/demo"
          cd "$RUNNER_TEMP/demo"
          git init -q && git add -A
          git -c user.name=ci -c user.email=ci@example.com commit -qm base
          copier update --defaults --trust --data deploy_target=cloud-run --data gcp_project=demo-proj --data gcp_region=us-central1
          test -f cloudrun.prod.yaml && test ! -f docker-compose.coolify.yml
          # Con `bash -e`, un `! cmd` que falla no corta el script: chequeo explícito.
          if git ls-files -mo --exclude-standard | grep -E '[.]rej$'; then echo "hay .rej"; exit 1; fi
          if grep -rlE '^(<<<<<<<|>>>>>>>) ' --exclude-dir=.git .; then echo "hay conflictos"; exit 1; fi
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ runner.temp }}/demo/go.mod
      - name: Sigue compilando
        working-directory: ${{ runner.temp }}/demo
        run: go build ./... && go vet ./... && go test -count=1 ./...

  # Repo de contratos con go + python + typescript: lint, generación con los
  # plugins remotos de la BSR, código generado al día y compilación por lenguaje.
  # (java/kotlin/swift se verificaron a mano; ver templates/protos/README.md)
  protos:
    runs-on: ubuntu-latest
    env:
      BUF_TOKEN: ${{ secrets.BUF_TOKEN }}   # opcional: evita el límite de la BSR sin autenticar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install copier
      - uses: bufbuild/buf-action@v1
        with: { setup_only: true }
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - name: Generar
        run: |
          copier copy --defaults --trust -d org_name=demo -d 'languages=[go, python, typescript]' \
            templates/protos "$RUNNER_TEMP/protos"
          cd "$RUNNER_TEMP/protos"
          git init -q && git add -A
          git -c user.name=ci -c user.email=ci@example.com commit -qm base
          make generate
          git add -A && git -c user.name=ci -c user.email=ci@example.com commit -qm gen --allow-empty
      - name: make check
        working-directory: ${{ runner.temp }}/protos
        run: make check

  # Repo de documentación: frontmatter válido, generados al día (generar + diff),
  # sitio con --strict, `make nuevo` y que validar detecte errores. Con coolify,
  # además, la imagen Caddy sirve el sitio.
  docs:
    name: docs (${{ matrix.ci }}, ${{ matrix.deploy }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { ci: github, deploy: firebase-hosting, obsidian: true,  repos: "[protos, api-gateway, orders-service]" }
          - { ci: gitlab, deploy: coolify,          obsidian: false, repos: "[protos, api-gateway]" }
          - { ci: gitlab, deploy: ninguno,          obsidian: true,  repos: "[]" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - run: pip install copier
      - name: Generar
        run: |
          copier copy --defaults --trust \
            -d org_name=demo -d ci_provider=${{ matrix.ci }} -d deploy_target=${{ matrix.deploy }} \
            -d obsidian=${{ matrix.obsidian }} -d 'repos_iniciales=${{ matrix.repos }}' \
            templates/docs "$RUNNER_TEMP/docs"
          cd "$RUNNER_TEMP/docs"
          git init -q -b main && git add -A
          git -c user.name=ci -c user.email=ci@example.com commit -qm base
      - name: validar, generar sin diff y construir
        working-directory: ${{ runner.temp }}/docs
        run: |
          pip install -r requirements.txt
          make validar
          make generar
          git diff --exit-code -- contenido/_generado
          test -z "$(git status --porcelain --untracked-files=all -- contenido/_generado)"
          make construir
      - name: make nuevo y errores detectados
        working-directory: ${{ runner.temp }}/docs
        run: |
          make nuevo TIPO=issue TITULO="Primer issue" && make nuevo TIPO=issue TITULO="Segundo issue"
          test -f contenido/issues/002-primer-issue/issue.md && test -f contenido/issues/003-segundo-issue/issue.md
          make validar-frontmatter
          sed -i 's/^estado: abierto/estado: cerrado/' contenido/issues/002-primer-issue/issue.md
          if make validar-frontmatter; then echo "validar no detectó estado: cerrado"; exit 1; fi
      - name: Imagen Docker (coolify)
        if: matrix.deploy == 'coolify'
        working-directory: ${{ runner.temp }}/docs
        run: |
          docker build -t docs:ci .
          docker run -d --name docs -p 8080:80 docs:ci
          for _ in $(seq 1 20); do curl -fsS -o /dev/null http://localhost:8080/ && break; sleep 1; done
          curl -fsS http://localhost:8080/ | grep -q 'Documentación de demo'
          curl -fsS http://localhost:8080/issues/001-issue-de-ejemplo/issue/ | grep -q 'class="metadatos"'
          curl -fsS http://localhost:8080/_generado/servicios/ | grep -q 'class="mermaid"'

  # App Android: checks, tests (JVM + Robolectric) y build debug en la JVM, sin
  # emulador. ubuntu-latest trae el Android SDK (AGP baja la plataforma que falte).
  # grpc: publica antes un protos (kotlin) en mavenLocal, como haría el co-desarrollo.
  android-app:
    name: android-app (${{ matrix.api }}, firebase=${{ matrix.firebase }}, ${{ matrix.ci }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BUF_TOKEN: ${{ secrets.BUF_TOKEN }}   # opcional: evita el límite de la BSR sin autenticar
    strategy:
      fail-fast: false
      matrix:
        include:
          - { api: rest, firebase: true,  ci: gitlab }
          - { api: grpc, firebase: false, ci: github }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install copier
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - uses: bufbuild/buf-action@v1
        if: matrix.api == 'grpc'
        with: { setup_only: true }
      - name: Contratos (protos con kotlin) en mavenLocal
        if: matrix.api == 'grpc'
        run: |
          copier copy --defaults --trust -d org_name=miorg -d maven_group=com.miorg -d 'languages=[kotlin]' \
            templates/protos "$RUNNER_TEMP/protos"
          cd "$RUNNER_TEMP/protos"
          bash scripts/generate.sh
          cd gen/jvm && sh ./gradlew --no-daemon publishToMavenLocal
      - name: Generar
        run: |
          copier copy --defaults --trust \
            -d cliente_api=${{ matrix.api }} -d firebase=${{ matrix.firebase }} -d ci_provider=${{ matrix.ci }} \
            -d protos_maven=com.miorg:protos:0.1.0 \
            templates/android-app "$RUNNER_TEMP/app"
      - name: ktlint, detekt, lint, tests y assembleDebug
        working-directory: ${{ runner.temp }}/app
        run: sh ./gradlew ktlintCheck detekt lint testDebugUnitTest assembleDebug
      - name: core:model sigue siendo Kotlin puro
        working-directory: ${{ runner.temp }}/app
        run: |
          printf '\ndependencies { implementation("com.google.android:android:4.1.1.4") }\n' >> core/model/build.gradle.kts
          if sh ./gradlew :core:model:verificarKotlinPuro; then echo "verificarKotlinPuro no detectó la dependencia de Android"; exit 1; fi
      - name: Reportes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-app-${{ matrix.api }}-${{ matrix.ci }}
          path: ${{ runner.temp }}/app/**/build/reports/
          retention-days: 7
