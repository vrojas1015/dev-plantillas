# Catálogo de plantillas de dev-plantillas. Lo leen `dp list` y `dp new`.
# La última versión de cada plantilla NO va acá: sale de los tags de su repo.
# Formato: docs/08-cli-dp.md §3.
version: 1
plantillas:
  - nombre: go-grpc-service
    repo: gh:dev-plantillas/template-go-grpc-service
    tipo: backend
    lenguaje: go
    descripcion: Microservicio Go gRPC hexagonal + Postgres (Cloud Run o Coolify)
    destino_por_defecto: backend/{nombre}-service
    atajos:
      deploy: deploy_target
      ci: ci_provider

  - nombre: protos
    repo: gh:dev-plantillas/template-protos
    tipo: contratos
    lenguaje: proto
    descripcion: Contratos gRPC con buf; código para Go, Python, TS/JS, Java, Kotlin y Swift
    destino_por_defecto: backend/{nombre}
    atajos:
      ci: ci_provider

  - nombre: api-gateway
    repo: gh:dev-plantillas/template-api-gateway
    tipo: gateway
    lenguaje: go
    descripcion: API gateway REST→gRPC con auth, autorización por ruta y rate limit
    destino_por_defecto: backend/{nombre}
    atajos:
      deploy: deploy_target
      ci: ci_provider
      auth: auth

  - nombre: angular-app
    repo: gh:dev-plantillas/template-angular-app
    tipo: front
    lenguaje: typescript
    descripcion: App Angular standalone + signals (Firebase Hosting o Coolify)
    destino_por_defecto: frontend/{nombre}
    atajos:
      deploy: deploy_target
      ci: ci_provider

  - nombre: docs
    repo: gh:dev-plantillas/template-docs
    tipo: docs
    lenguaje: markdown
    descripcion: Repo de documentación con issues, ADRs, runbooks y MkDocs Material
    destino_por_defecto: "{nombre}"
    atajos:
      deploy: deploy_target
      ci: ci_provider

  - nombre: astro-site
    repo: gh:dev-plantillas/template-astro-site
    tipo: front
    lenguaje: typescript
    descripcion: Sitio público con Astro e islas de React, SEO técnico y Lighthouse CI
    destino_por_defecto: frontend/{nombre}
    atajos:
      deploy: deploy_target
      ci: ci_provider

  - nombre: android-app
    repo: gh:dev-plantillas/template-android-app
    tipo: movil
    lenguaje: kotlin
    descripcion: App Android nativa con Kotlin, Compose, Hilt, Room y publicación en Google Play
    destino_por_defecto: mobile/{nombre}
    atajos:
      ci: ci_provider

  - nombre: e2e-tests
    repo: gh:dev-plantillas/template-e2e-tests
    tipo: pruebas
    lenguaje: typescript
    descripcion: Pruebas end-to-end con Playwright, Schemathesis y k6, con registro de casos de uso
    destino_por_defecto: tools/{nombre}
    atajos:
      ci: ci_provider
